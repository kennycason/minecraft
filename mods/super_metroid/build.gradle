plugins {
    id "fabric-loom" version "1.15.5"
    id "org.jetbrains.kotlin.jvm" version "2.3.21"
}

version = "1.0.0"
group = "com.kenny"

base {
    archivesName = "super-metroid-mod"
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
        metadataSources {
            artifact()
        }
    }
}

loom {
    noIntermediateMappings()
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    mappings "net.fabricmc:intermediary:0.0.0:v2"
    implementation "net.fabricmc:fabric-loader:0.19.2"
    implementation "net.fabricmc.fabric-api:fabric-api:0.148.0+26.1.2"
    implementation "net.fabricmc:fabric-language-kotlin:1.13.11+kotlin.2.3.21"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.3.21"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

tasks.test {
    useJUnitPlatform()
}

tasks.processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
