name: Build AntFarm Mod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the build'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./mods/antfarm/gradlew

      - name: Build with Gradle
        working-directory: ./mods/antfarm
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: antfarm-mod-${{ github.event.inputs.version }}
          path: mods/antfarm/build/libs/antfarm-mod-*.jar
          retention-days: 30

      - name: Create Release (optional)
        if: github.event.inputs.version != '1.0.0'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: AntFarm Mod v${{ github.event.inputs.version }}
          files: mods/antfarm/build/libs/antfarm-mod-*.jar
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

